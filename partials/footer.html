<footer class="pied">
  <div class="pied__conteneur">

    <!-- Bandeau de chantier. À retirer le jour de la mise en ligne
         publique : chercher `pied__chantier`, ici et dans le CSS. -->
    <p class="pied__chantier">
      <strong>Site en construction</strong> — les textes, les visuels et les tarifs
      affichés ici sont provisoires et non contractuels.
    </p>

    <div class="pied__grille">

      <!-- L'identité, ancrée par le sceau -->
      <div class="pied__identite">
        <div class="pied__marque">
          <svg class="pied__sceau" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="sceauPied" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f0e0b8"/>
                <stop offset="100%" stop-color="#c9a227"/>
              </linearGradient>
            <filter id="flouPied" x="-120%" y="-120%" width="340%" height="340%">
              <feGaussianBlur stdDeviation="1.5"/>
            </filter>
            </defs>
            <g transform="translate(24 24) scale(1.45) translate(-24 -25.55)">
              <path d="M24 37.5 C14.5 30 9.5 25.5 9.5 20.6 C9.5 16.4 13 13.6 16.8 13.6 C19.6 13.6 22.4 15.2 24 17.8 C25.6 15.2 28.4 13.6 31.2 13.6 C35 13.6 38.5 16.4 38.5 20.6 C38.5 25.5 33.5 30 24 37.5 Z" fill="none" stroke="url(#sceauPied)"
                    stroke-width="1.03" stroke-linejoin="round"/>
              <circle cx="24" cy="23" r="2.48" fill="#ffe9b0" opacity=".62" filter="url(#flouPied)"/>
              <g stroke="url(#sceauPied)" stroke-width="0.76" stroke-linecap="round" opacity=".5">
                <path d="M20.2 19.2l-2.6-2.6M27.8 26.8l2.6 2.6M27.8 19.2l2.6-2.6M20.2 26.8l-2.6 2.6"/>
              </g>
              <path d="M24 16.3C24.55 20.8 26.9 23.1 31.4 23.65C26.9 24.2 24.55 26.5 24 31C23.45 26.5 21.1 24.2 16.6 23.65C21.1 23.1 23.45 20.8 24 16.3 Z" fill="url(#sceauPied)"/>
            </g>
          </svg>
          <div>
            <p class="pied__nom" data-site="nom">Cœur Alchimique</p>
            <p class="pied__baseline" data-site="baseline">Au cœur de l'Enfant Intérieur.</p>
          </div>
        </div>

        <a class="pied__mail" data-site="mailtoEmail" href="#">
          <span data-site="email">contact@coeuralchimique.fr</span>
        </a>

        <div class="reseaux" data-liste="reseaux"></div>
      </div>

      <!-- Le cadre légal. Ce n'est pas une mention en petits caractères :
           c'est le positionnement de toute la pratique. Il a donc sa place
           et son encadré, pas une ligne perdue en bas à droite. -->
      <div class="pied__cadre" data-cadre-court>
        <h4>Le cadre</h4>
      </div>

      <div class="pied__liens">
        <h4>Informations</h4>
        <ul data-liste="navSecondaire"></ul>
      </div>

    </div>

    <div class="pied__bas">
      <span>© <span data-annee>2026</span> <span data-site="praticienne">Sophie Loret</span> — Tous droits réservés</span>
      <span data-site="mentionTechnique">Aucun cookie, aucun traceur.</span>
    </div>

  </div>
</footer>

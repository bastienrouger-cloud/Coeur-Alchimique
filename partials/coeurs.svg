<!--
  Les trois cœurs.

  Un seul contour pour les trois — le même que la marque — et une seule
  chose qui change : la lumière à l'intérieur. C'est une progression,
  pas trois dessins.

      blessé      un point froid, et une fissure. La lumière est là,
                  enfermée. Rien n'est cassé en deux : le contour reste
                  entier, c'est le propos.
      alchimique  l'éclat, et le contour qui bascule du bleu à l'or en
                  montant. Le plomb devient or.
      créateur    le même éclat, mais les rayons sortent du cœur. Il ne
                  la contient plus.

  Le facteur d'échelle est 1,3 et non 1,45 comme la marque : il faut
  laisser de la marge pour les rayons du créateur, qui dépassent le
  contour. Les trois doivent faire la même taille pour se lire comme
  une famille, donc les trois prennent 1,3.

  Planche de symboles : rien ne s'affiche ici, tout passe par <use>.
  Elle est injectée AVANT que les cartes ne soient construites — un
  <use> dont la cible n'existe pas encore reste vide.
-->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <!-- Froid : le bleu du site, clair en haut, profond en bas. -->
    <linearGradient id="coeurFroid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8cbef"/>
      <stop offset="100%" stop-color="#2f6bb5"/>
    </linearGradient>

    <!-- La bascule. Ces quatre teintes attendaient depuis le début
         « la seule zone du site où le bleu bascule vers l'or » : c'est
         ici. Le bas reste bleu, le haut est déjà or. -->
    <linearGradient id="coeurBascule" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3f74b0"/>
      <stop offset="38%" stop-color="#a8cbef"/>
      <stop offset="70%" stop-color="#e7cf8f"/>
      <stop offset="100%" stop-color="#f0e0b8"/>
    </linearGradient>

    <linearGradient id="coeurOr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e0b8"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>

    <filter id="coeurFlou" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- ---------- Blessé ---------- -->
    <g id="coeur-blesse">
      <g transform="translate(24 24) scale(1.3) translate(-24 -25.55)">
        <path d="M24 37.5 C14.5 30 9.5 25.5 9.5 20.6 C9.5 16.4 13 13.6 16.8 13.6 C19.6 13.6 22.4 15.2 24 17.8 C25.6 15.2 28.4 13.6 31.2 13.6 C35 13.6 38.5 16.4 38.5 20.6 C38.5 25.5 33.5 30 24 37.5 Z" fill="none" stroke="url(#coeurFroid)"
              stroke-width="1.15" stroke-linejoin="round"/>
        <!-- Le même éclat que les deux autres, mais froid et presque
             éteint : la lumière est là, enfermée, pas absente. -->
        <path d="M24 16.3C24.55 20.8 26.9 23.1 31.4 23.65C26.9 24.2 24.55 26.5 24 31C23.45 26.5 21.1 24.2 16.6 23.65C21.1 23.1 23.45 20.8 24 16.3 Z"
              fill="#a8cbef" opacity=".22"/>
        <!-- La fissure ne traverse pas de part en part : elle part du
             creux et s'arrête avant la pointe. Le cœur tient. -->
        <path d="M24 19.6 L27 23.4 L20.8 26.6 L25.4 30 L23.6 33.4"
              fill="none" stroke="url(#coeurFroid)" stroke-width="0.88"
              stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
      </g>
    </g>

    <!-- ---------- Alchimique ---------- -->
    <g id="coeur-alchimique">
      <g transform="translate(24 24) scale(1.3) translate(-24 -25.55)">
        <path d="M24 37.5 C14.5 30 9.5 25.5 9.5 20.6 C9.5 16.4 13 13.6 16.8 13.6 C19.6 13.6 22.4 15.2 24 17.8 C25.6 15.2 28.4 13.6 31.2 13.6 C35 13.6 38.5 16.4 38.5 20.6 C38.5 25.5 33.5 30 24 37.5 Z" fill="none" stroke="url(#coeurBascule)"
              stroke-width="1.15" stroke-linejoin="round"/>
        <circle cx="24" cy="23" r="2.77" fill="#ffe9b0" opacity=".6" filter="url(#coeurFlou)"/>
        <g stroke="url(#coeurOr)" stroke-width="0.85" stroke-linecap="round" opacity=".5">
          <path d="M20.2 19.2l-2.6-2.6M27.8 26.8l2.6 2.6M27.8 19.2l2.6-2.6M20.2 26.8l-2.6 2.6"/>
        </g>
        <path d="M24 16.3C24.55 20.8 26.9 23.1 31.4 23.65C26.9 24.2 24.55 26.5 24 31C23.45 26.5 21.1 24.2 16.6 23.65C21.1 23.1 23.45 20.8 24 16.3 Z" fill="url(#coeurOr)"/>
      </g>
    </g>

    <!-- ---------- Créateur ---------- -->
    <g id="coeur-createur">
      <g transform="translate(24 24) scale(1.3) translate(-24 -25.55)">
        <path d="M24 37.5 C14.5 30 9.5 25.5 9.5 20.6 C9.5 16.4 13 13.6 16.8 13.6 C19.6 13.6 22.4 15.2 24 17.8 C25.6 15.2 28.4 13.6 31.2 13.6 C35 13.6 38.5 16.4 38.5 20.6 C38.5 25.5 33.5 30 24 37.5 Z" fill="none" stroke="url(#coeurOr)"
              stroke-width="1.15" stroke-linejoin="round"/>
        <circle cx="24" cy="23.65" r="3.2" fill="#ffe9b0" opacity=".62" filter="url(#coeurFlou)"/>
        <!-- Quatre éclats posés AUTOUR du cœur, pas au travers. Des
             rayons qui partent du centre et traversent le contour
             faisaient deux antennes en haut des lobes — le même piège
             que le premier soleil. Détachés, ils disent la même chose :
             c'est le seul des trois où la lumière déborde. -->
        <g stroke="url(#coeurOr)" stroke-width="0.9" stroke-linecap="round" opacity=".75">
          <path d="M36 11.65L38.85 8.8M12 11.65L9.15 8.8M36 35.65L38.85 38.5M12 35.65L9.15 38.5"/>
        </g>
        <path d="M24 16.3C24.55 20.8 26.9 23.1 31.4 23.65C26.9 24.2 24.55 26.5 24 31C23.45 26.5 21.1 24.2 16.6 23.65C21.1 23.1 23.45 20.8 24 16.3 Z" fill="url(#coeurOr)"/>
      </g>
    </g>
  </defs>
</svg>

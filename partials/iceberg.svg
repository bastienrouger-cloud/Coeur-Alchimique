<svg class="iceberg__dessin" viewBox="0 0 400 420" role="img"
     aria-label="Un iceberg : une petite pointe émerge au-dessus de la ligne de flottaison, l'essentiel du volume reste immergé." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glaceHaut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0b8"/>
      <stop offset="100%" stop-color="#bcd3ea"/>
    </linearGradient>
    <linearGradient id="glaceBas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b87b8" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#1d3457" stop-opacity=".75"/>
    </linearGradient>
    <!-- Pas de rectangle d'eau : un aplat opaque dessine une boîte
         visible sur le fond de la section. Même piège que les halos
         au début du projet. La ligne de flottaison suffit, et elle
         s'éteint avant les bords. -->
    <linearGradient id="flottaison" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e3c879" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#e3c879" stop-opacity=".9"/>
      <stop offset="82%"  stop-color="#e3c879" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e3c879" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- l'essentiel du volume, sous la ligne -->
  <path d="M140 128 L260 128 L286 186 L262 244 L292 300 L236 362 L196 410 L150 356 L108 306 L128 246 L104 188 Z"
        fill="url(#glaceBas)"/>
  <!-- la pointe, au-dessus -->
  <path d="M200 36 L246 104 L260 128 L140 128 L156 102 Z" fill="url(#glaceHaut)"/>

  <line x1="0" y1="128" x2="400" y2="128" stroke="url(#flottaison)" stroke-width="1.4"/>
  <line x1="0" y1="128" x2="400" y2="128" stroke="url(#flottaison)" stroke-width="7" opacity=".16"/>
</svg>

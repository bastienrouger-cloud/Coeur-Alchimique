<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Médiathèque — Cœur Alchimique</title>
  <meta name="description" content="Contes, e-books, méditations et exercices de Sophie Loret, en grande partie en accès libre. Rangés en trois rayons : lire, écouter, pratiquer.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cœur Alchimique">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="La Médiathèque — Cœur Alchimique">
  <meta property="og:description" content="Contes, e-books, méditations et exercices de Sophie Loret, en grande partie en accès libre. Rangés en trois rayons : lire, écouter, pratiquer.">
  <meta property="og:url" content="https://bastienrouger-cloud.github.io/Coeur-Alchimique/pages/mediatheque.html">
  <meta property="og:image" content="https://bastienrouger-cloud.github.io/Coeur-Alchimique/assets/images/og-coeur-alchimique.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cœur Alchimique — De l'Enfant Intérieur Blessé à l'Enfant Intérieur Créateur.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://bastienrouger-cloud.github.io/Coeur-Alchimique/pages/mediatheque.html">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/socle.js" defer></script>
  <script src="../js/rendu.js" defer></script>
</head>
<body>
  <a class="lien-evitement" href="#principal">Aller au contenu</a>
  <div data-partial="entete"></div>
  <nav class="sommaire" data-sommaire-hote></nav>
  <noscript>
    <div class="avertissement-js">
      <strong>JavaScript est désactivé.</strong> Le menu et une partie du contenu ne
      s'afficheront pas. Les pages restent accessibles directement :
      <a href="../index.html">Accueil</a>,
      <a href="accompagnement.html">Accompagnement</a>,
      <a href="e-learnings.html">E-learnings</a>,
      <a href="livres.html">Livres</a>,
      <a href="mediatheque.html">Médiathèque</a>,
      <a href="sophie.html">Sophie</a>,
      <a href="contact.html">Contact</a>.
    </div>
  </noscript>

  <main id="principal">

    <!-- La photo et le voile sont en z-index négatif dans la section,
         qui porte isolation:isolate : ils restent derrière le contenu
         sans jamais passer sous le reste de la page.

         Deux largeurs seulement, et non trois comme sur l'accueil :
         l'original fait 1536 px de large malgré son nom de fichier.
         Fabriquer un 2400 reviendrait à étirer des pixels inventés —
         plus lourd à télécharger, pas plus net à l'écran. -->
    <section class="hero hero--illustre hero--voile-bleu" style="--vers:var(--g2)" data-theme="sombre">
      <div class="hero__photo" aria-hidden="true">
        <img src="../assets/images/mediatheque/hero-mediatheque-1536.webp"
             srcset="../assets/images/mediatheque/hero-mediatheque-1200.webp 1200w,
                     ../assets/images/mediatheque/hero-mediatheque-1536.webp 1536w"
             sizes="100vw"
             alt="" width="1536" height="1024" fetchpriority="high">
      </div>
      <div class="hero__voile" aria-hidden="true"></div>

      <div class="contenu">
        <div class="entete-section">
          <span class="surtitre">Tout ce qui se lit, s'écoute et se pratique</span>
          <h1>La Médiathèque</h1>
          <div data-rendu="mediatheque-intro"></div>
        </div>
      </div>
    </section>

    <div data-rendu="mediatheque-rayons"></div>

    <!-- Le vocabulaire. Les cartes ne portent que le mot : c'est une
         planche de contact, pas une page de dictionnaire. On ouvre
         celui qui accroche, et la définition arrive dans une fiche
         par-dessus la page, sans quitter le rayon où on était.

         Chaque terme a son ancre (#mot-xxx) : un article pourra
         pointer directement sur une définition. -->
    <section id="vocabulaire" class="fondu" style="--de:var(--g2); --vers:var(--g3)"
             data-theme="sombre" data-sommaire="Vocabulaire">
      <div class="contenu">
        <div data-rendu="vocabulaire-intro"></div>
        <div data-rendu="vocabulaire-termes"></div>
      </div>
    </section>

    <!-- Les articles. Même moule de carte, destination différente :
         une page à soi, pas une fiche par-dessus. C'est précisément la
         question qu'on s'est posée — un mot et un article peuvent-ils
         vivre au même endroit ? Les deux sections sont côte à côte pour
         qu'on puisse trancher en les regardant. -->
    <section id="articles" class="fondu" style="--de:var(--g3); --vers:var(--g1)"
             data-theme="sombre" data-sommaire="Articles">
      <div class="contenu">
        <div data-rendu="articles-intro"></div>
        <div data-rendu="articles-liste"></div>
      </div>
    </section>

    <!-- La fiche. Un seul <dialog> pour toute la page : son contenu est
         remplacé à chaque ouverture — une définition du vocabulaire, ou
         la présentation d'un livre ou d'un parcours. L'élément natif
         donne le piège au clavier, la fermeture par Échap, le fond
         inerte et le retour du focus, sans une ligne de JavaScript pour
         les refaire mal. -->
    <dialog class="fiche" id="fiche" aria-labelledby="fiche-titre">
      <form method="dialog" class="fiche__fermer-forme">
        <button class="fiche__fermer" type="submit" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </form>
      <div class="fiche__corps" data-fiche-corps></div>
    </dialog>

  </main>


  <div data-partial="pied"></div>
</body>
</html>
